          padding: 4px 10px;
          margin: 10px 0 6px 0;
          border-radius: 0 4px 4px 0;
          font-size: 12px;
        }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 15px;
          background: #00FF9D;
          vertical-align: middle;
          margin-left: 4px;
          animation: blink 1s infinite;
