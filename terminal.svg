<svg fill="none" viewBox="0 0 840 480" width="840" height="480" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes blink {
          0%, 100% { opacity: 1; }
