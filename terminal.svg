          font-size: 12px;
          color: #64748b;
          letter-spacing: 0.06em;
          margin-right: 48px;
        }
        .term-body {
          padding: 18px 22px;
          font-size: 12.5px;
          line-height: 1.55;
        }
        .prompt {
          color: #00FF9D;
          font-weight: bold;
        }
        .path {
