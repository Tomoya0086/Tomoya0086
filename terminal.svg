        }
        .cmd {
          color: #f1f5f9;
        }
        .ascii-art {
          color: #00F0FF;
          font-weight: 700;
          line-height: 1.15;
          margin: 0;
          font-size: 10.5px;
        }
        .accent { color: #00F0FF; }
        .accent2 { color: #00FF9D; }
        .purple { color: #c084fc; font-weight: 700; }
        .dim { color: #475569; }
        .label { color: #94a3b8; font-weight: 600; }
        .quote {
